tasks:
  # ============== 准备 ==============
  - id: T000
    role: test
    desc: "引入 vitest + playwright 测试基建"
    depends_on: []
    verify:
      - kind: cmd
        run: "npm ls vitest @testing-library/react happy-dom @playwright/test"
        expect_exit: 0
      - kind: file_contains
        path: "package.json"
        text: "\"test\":"
      - kind: file_contains
        path: "package.json"
        text: "\"test:e2e\":"
      - kind: file_contains
        path: "vitest.config.ts"
        text: "defineConfig"
      - kind: file_contains
        path: "playwright.config.ts"
        text: "defineConfig"
      - kind: cmd
        run: "npm test"
        expect_exit: 0
      - kind: cmd
        run: "npm run test:e2e -- --list"
        expect_exit: 0
      - kind: regression
        scope: "full"
        expect: all_pass

  # ============== 后端 ==============
  - id: T001
    role: backend
    desc: "server/types.ts 事件协议 + Job 扩展 + appendEvent 环形缓冲"
    depends_on: [T000]
    verify:
      - kind: cmd
        run: "npx tsc -p server/tsconfig.json"
        expect_exit: 0
      - kind: file_contains
        path: "server/types.ts"
        text: "export type StudioEvent"
      - kind: file_contains
        path: "server/types.ts"
        text: "export type ConversationTurn"
      - kind: file_matches
        path: "server/types.ts"
        regex: "conversation:\\s*ConversationTurn\\[\\]"
      - kind: file_matches
        path: "server/types.ts"
        regex: "events:\\s*StudioEvent\\[\\]"
      - kind: file_matches
        path: "server/types.ts"
        regex: "'cancelled'"
      - kind: file_contains
        path: "server/jobs.ts"
        text: "export function appendEvent"
      - kind: cmd
        run: "npm test -- server/jobs"
        expect_exit: 0
      - kind: regression
        scope: "full"
        expect: all_pass

  - id: T002
    role: backend
    desc: "prompts.ts 多轮对话改造：buildConversation + 反馈 system 指令"
    depends_on: [T001]
    verify:
      - kind: cmd
        run: "npx tsc -p server/tsconfig.json"
