      - kind: cmd
        run: "npm test -- providers/prompts"
        expect_exit: 0
      - kind: regression
        scope: "full"
        expect: all_pass

  - id: T003
    role: backend
    desc: "Anthropic streaming 适配器重写（messages.stream + yield 事件）"
    depends_on: [T002]
    verify:
      - kind: cmd
        run: "npx tsc -p server/tsconfig.json"
        expect_exit: 0
      - kind: file_contains
        path: "server/providers/anthropic.ts"
        text: "messages.stream"
      - kind: file_matches
        path: "server/providers/anthropic.ts"
        regex: "AsyncIterable|yield"
      - kind: cmd
        run: "npm test -- providers/anthropic"
        expect_exit: 0
      - kind: regression
        scope: "full"
        expect: all_pass

  - id: T004
